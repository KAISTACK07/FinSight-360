# Ruff config for the FinSight AWS data-engineering layer.
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "W", "UP", "B"]
# E402: module-level imports after code (Airflow DAGs / Spark bootstrap
# legitimately do this). E501 handled by the formatter.
ignore = ["E402", "E501"]

[lint.per-file-ignores]
"tests/*" = ["B"]
