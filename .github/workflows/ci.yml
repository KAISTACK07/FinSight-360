name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # PySpark needs a JVM for the local test session.
      - name: Set up Java (for PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        env:
          # pyspark 3.5.1's setup.py breaks on newer setuptools
          # (install_layout); build it against stdlib distutils.
          SETUPTOOLS_USE_DISTUTILS: stdlib
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<71" wheel
          pip install --no-build-isolation pyspark==3.5.1
          pip install pandas pyarrow python-dotenv sqlalchemy pytest ruff

      - name: Lint (ruff)
        run: ruff check src/aws dags lambda tests

      - name: Run tests (data-quality + transform)
        env:
          PYSPARK_PYTHON: python
        run: python -m pytest -q
